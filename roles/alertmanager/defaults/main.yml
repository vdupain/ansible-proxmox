---
alertmanager_version: latest
alertmanager_receivers:
  - name: "telegram"
    telegram_configs:
      - bot_token: "{{ telegram_bot_token }}"
        chat_id: {{ telegram_chat_id }}
        send_resolved: true
alertmanager_route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: telegram