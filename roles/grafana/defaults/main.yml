---
# Grafana version
grafana_version: latest

# Server settings
grafana_ini_default:
  server:
    http_addr: "0.0.0.0"
    http_port: 3000
    domain: "{{ ansible_host | default(inventory_hostname) }}"
    protocol: http
    enforce_domain: false
    enable_gzip: false
    router_logging: false
    serve_from_sub_path: false
  security:
    admin_user: admin
    admin_password: admin
  users:
    allow_sign_up: false
    auto_assign_org_role: Viewer
    default_theme: dark
  auth:
    anonymous:
      enabled: false

# Datasource — Prometheus
grafana_datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: "http://192.168.50.249:9090"
    isDefault: true
    editable: false

# Use provisioning
grafana_use_provisioning: true
grafana_provisioning_synced: false

# Plugins — none by default
grafana_plugins: []

# Alert notifications — none by default
grafana_alert_notifications: []

# API keys — none by default
grafana_api_keys: []

# Environment variables
grafana_environment: {}