---
# Custom Grafana configuration (overrides collection defaults)
grafana_ini_default:
  server:
    http_addr: "0.0.0.0"
    http_port: 3000
    protocol: http
    enforce_domain: false
    enable_gzip: false
    router_logging: false
    serve_from_sub_path: false
  security:
    admin_user: admin
  users:
    allow_sign_up: false
    auto_assign_org_role: Viewer
    default_theme: dark
  auth:
    anonymous:
      enabled: false

# Datasource — Prometheus
grafana_datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: "http://192.168.50.249:9090"
    isDefault: true
    editable: false